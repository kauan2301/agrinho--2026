<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForte: Comunidade & Desapego</title>
    <!-- Importação de Fonte Moderna e Ícones -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        :root {
            --verde-primario: #1b4332;
            --verde-sotaque: #2d6a4f;
            --verde-claro: #d8f3dc;
            --bg-site: #f8f9fa;
            --texto-principal: #1a1d20;
            --texto-secundario: #5c636a;
            --branco: #ffffff;
            --laranja-alerta: #e65c00;
            --azul-comercio: #0077b6;
            --borda: #e9ecef;
            --sombra: 0 8px 30px rgba(0, 0, 0, 0.04);
            --raio: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-site);
            color: var(--texto-principal);
            -webkit-font-smoothing: antialiased;
        }

        /* Header Premium */
        header {
            background: linear-gradient(135deg, var(--verde-primario), #081c15);
            color: var(--branco);
            padding: 60px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.85;
            max-width: 600px;
            margin: 0 auto;
            font-weight: 400;
            line-height: 1.6;
        }

        /* Menu de Acesso Rápido */
        .abas-container {
            max-width: 500px;
            margin: -25px auto 40px auto;
            background: var(--branco);
            padding: 6px;
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            display: flex;
            position: relative;
            z-index: 10;
        }

        .aba-link {
            flex: 1;
            padding: 14px 24px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--texto-secundario);
            cursor: pointer;
            border-radius: 100px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .aba-link:hover {
            background: #f5f5f5;
            color: var(--texto-principal);
        }

        .aba-link.verde-btn {
            background: var(--verde-claro);
            color: #0f5132;
        }

        .aba-link.azul-btn {
            background: #e0f2fe;
            color: #0369a1;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto 60px auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        /* Estrutura das Seções Lado a Lado / Empilhadas */
        .conteudo-secao {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            padding-top: 20px;
        }

        @media (min-width: 900px) {
            .conteudo-secao {
                grid-template-columns: 420px 1fr;
                align-items: start;
            }
        }

        /* Formulários Premium */
        .box-publicar {
            background: var(--branco);
            padding: 30px;
            border-radius: var(--raio);
            box-shadow: var(--sombra);
            border: 1px solid var(--borda);
            position: sticky;
            top: 20px;
        }

        .box-publicar h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--texto-principal);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--texto-principal);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--texto-principal);
            outline: none;
            background-color: #fdfdfd;
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #adb5bd;
            background-color: var(--branco);
        }

        /* Botões */
        .btn {
            background-color: var(--verde-sotaque);
            color: var(--branco);
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { 
            filter: brightness(1.1);
        }
        
        .btn-venda { 
            background-color: var(--azul-comercio); 
        }

        /* Listagens */
        .coluna-feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .titulo-coluna {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--texto-principal);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Tópicos do Fórum */
        .topico {
            background: var(--branco);
            padding: 24px;
            border-radius: var(--raio);
            box-shadow: var(--sombra);
            border: 1px solid var(--borda);
            border-left: 5px solid var(--verde-sotaque);
        }

        .topico.tag-praga { 
            border-left-color: var(--laranja-alerta); 
        }
        
        .topico-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .bg-praga { background-color: #fff3cd; color: #664d03; }
        .bg-plantio { background-color: #d1e7dd; color: #0f5132; }
        .autor { font-size: 0.85rem; color: var(--texto-secundario); font-weight: 500; }

        .topico h4 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--texto-principal);
        }

        .topico p {
            font-size: 0.95rem;
            color: var(--texto-secundario);
            line-height: 1.6;
        }

        /* Vitrine de Vendas */
        .vitrine {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .produto-card {
            background: var(--branco);
            border-radius: var(--raio);
            box-shadow: var(--sombra);
            border: 1px solid var(--borda);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 250px;
            border-top: 4px solid var(--azul-comercio);
        }

        .preco {
            font-size: 1.5rem;
            color: var(--azul-comercio);
            font-weight: 700;
            margin: 16px 0;
        }

        .zap-btn {
            background-color: #25d366;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .zap-btn:hover { background-color: #1ebe57; }

        /* Divisor Visual Elegante */
        .divisor-secao {
            border: none;
            border-top: 2px dashed #e2e8f0;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌱 AgroForte</h1>
        <p>Agro forte, futuro sustentável: o equilíbrio que transforma a produção e protege a nossa terra.</p>
    </header>

    <!-- Botões que usam Links Seguros de Rolagem (#) -->
    <div class="abas-container">
        <a href="#secao-forum" class="aba-link verde-btn">
            <i class="fa-regular fa-comments"></i> Ir para Fórum
        </a>
        <a href="#secao-classificados" class="aba-link azul-btn">
            <i class="fa-solid fa-store"></i> Ir para Vendas
        </a>
    </div>

    <div class="container">
        
        <!-- SEÇÃO 1: FÓRUM (Sempre visível e acessível) -->
        <section id="secao-forum" class="conteudo-secao">
            <div class="box-publicar">
                <h2><i class="fa-regular fa-pen-to-square" style="color: var(--verde-sotaque)"></i> Nova Publicação</h2>
