<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForte: Comunidade & Desapego</title>
    <style>
        :root {
            --verde-forte: #2e7d32;
            --verde-claro: #81c784;
            --solo: #f4f6f4;
            --texto-escuro: #2c3e50;
            --branco: #ffffff;
            --laranja-alerta: #e67e22;
            --azul-comercio: #2980b9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--solo);
            color: var(--texto-escuro);
        }

        header {
            background: linear-gradient(135deg, var(--verde-forte), #1b5e20);
            color: var(--branco);
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { font-size: 2.2rem; margin-bottom: 10px; }
        header p { font-size: 1.1rem; opacity: 0.9; }

        /* Abas de Navegação Ajustadas */
        .abas {
            display: flex;
            justify-content: center;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .aba-btn {
            flex: 1;
            max-width: 300px;
            padding: 18px;
            text-align: center;
            background: #fdfdfd;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            color: #7f8c8d;
            cursor: pointer;
            border-bottom: 4px solid #eee;
            transition: all 0.2s ease-in-out;
        }

        .aba-btn:hover {
            background: #f5f5f5;
            color: #333;
        }

        .aba-btn.ativa {
            color: var(--verde-forte);
            border-bottom: 4px solid var(--verde-forte);
            background: #fff;
        }

        .aba-btn.venda-ativa.ativa {
            color: var(--azul-comercio);
            border-bottom: 4px solid var(--azul-comercio);
        }

        .container {
            max-width: 900px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }

        /* Controle das seções */
        .conteudo-secao {
            display: none !important;
        }

        .conteudo-secao.visivel {
            display: block !important;
        }

        /* Formulários */
        .box-publicar {
            background: var(--branco);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .box-publicar h2 {
            font-size: 1.4rem;
            color: var(--verde-forte);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--verde-claro);
        }

        .btn {
            background-color: var(--verde-forte);
            color: var(--branco);
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .btn:hover { background-color: #1b5e20; }
        .btn-venda { background-color: var(--azul-comercio); }
        .btn-venda:hover { background-color: #1f618d; }

        /* Estilos do Fórum */
        .feed { display: flex; flex-direction: column; gap: 20px; }
        
        .topico {
            background: var(--branco);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 6px solid var(--verde-forte);
        }

        .topico.tag-praga { border-left-color: var(--laranja-alerta); }
        
        .topico-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }

        .bg-praga { background-color: var(--laranja-alerta); }
        .bg-plantio { background-color: var(--verde-forte); }
        .autor { font-size: 0.85rem; color: #7f8c8d; }

        /* Estilos do Marketplace (Vendas) */
        .vitrine {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .produto-card {
            background: var(--branco);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 5px solid var(--azul-comercio);
        }

        .preco {
            font-size: 1.4rem;
            color: var(--azul-comercio);
            font-weight: bold;
            margin: 10px 0;
        }

        .zap-btn {
            background-color: #25d366;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        .zap-btn:hover { background-color: #128c7e; }
    </style>
</head>
<body>

    <header>
        <h1>🌱 AgroForte Sustentável</h1>
        <p>Tire dúvidas sobre cultivo e negocie itens que você não usa mais!</p>
    </header>

    <!-- Menu de Abas Corrigido -->
    <div class="abas">
        <button id="btn-forum" class="aba-btn ativa" onclick="mudarAba('forum')">💬 Dúvidas e Pragas</button>
        <button id="btn-vendas" class="aba-btn" onclick="mudarAba('classificados')">🛒 Desapego / Vendas</button>
    </div>

    <div class="container">
        
        <!-- SEÇÃO 1: FÓRUM -->
        <div id="secao-forum" class="conteudo-secao visivel">
            <div class="box-publicar">
                <h2>💬 Nova Dúvida ou Dica</h2>
                <form id="forumForm">
                    <div class="form-group">
                        <label for="autor">Seu Nome:</label>
                        <input type="text" id="autor" placeholder="Ex: João Silva" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoria:</label>
                        <select id="categoria" required>
                            <option value="plantio">🌱 Como Plantar / Cultivo</option>
                            <option value="praga">🐛 Combate a Pragas e Doenças</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="titulo">Assunto / Pergunta:</label>
                        <input type="text" id="titulo" placeholder="Ex: Como acabar com pulgão na couve?" required>
                    </div>
                    <div class="form-group">
                        <label for="conteudo">Detalhes do problema:</label>
                        <textarea id="conteudo" placeholder="Descreva o que está acontecendo..." required></textarea>
                    </div>
                    <button type="submit" class="btn">Publicar no Fórum</button>
                </form>
            </div>

            <h3 style="margin-bottom: 15px; color: var(--verde-forte);">Perguntas da Comunidade</h3>
            <div class="feed" id="forumFeed"></div>
        </div>

        <!-- SEÇÃO 2: CLASSIFICADOS / VENDAS -->
        <div id="secao-classificados" class="conteudo-secao">
            <div class="box-publicar" style="border-top: 4px solid var(--azul-comercio);">
                <h2 style="color: var(--azul-comercio);">🛒 Anunciar um Desapego</h2>
                <form id="vendasForm">
                    <div class="form-group">
                        <label for="vendedor">Seu Nome:</label>
                        <input type="text" id="vendedor" placeholder="Ex: Maria Souza" required>
                    </div>
                    <div class="form-group">
                        <label for="produto">Item para Vender ou Trocar:</label>
                        <input type="text" id="produto" placeholder="Ex: Enxada antiga / Sobras de adubo orgânico" required>
                    </div>
                    <div class="form-group">
                        <label for="preco">Preço (R$):</label>
                        <input type="text" id="preco" placeholder="Ex: 45,00 (ou digite Troca)" required>
                    </div>
                    <div class="form-group">
                        <label for="whatsapp">Seu Celular / WhatsApp (Apenas números com DDD):</label>
                        <input type="tel" id="whatsapp" placeholder="Ex: 11999999999" required>
                    </div>
                    <div class="form-group">
                        <label for="descProduto">Condição do Item / Detalhes:</label>
                        <textarea id="descProduto" placeholder="Descreva o estado do produto e região de entrega..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-venda">Colocar à Venda</button>
                </form>
            </div>
