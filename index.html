<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroForte: Comunidade & Desapego</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { 
            --verde: #2d6a4f; 
            --verde-escuro: #1b4332; 
            --bg: #f8f9fa; 
            --branco: #ffffff; 
            --texto: #1a1d20; 
            --laranja: #e65c00; 
            --azul: #0077b6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg); color: var(--texto); }
        
        header { 
            background: linear-gradient(135deg, var(--verde-escuro), #081c15); 
            color: var(--branco); 
            padding: 50px 20px; 
            text-align: center; 
        }
        header h1 { font-size: 2.4rem; margin-bottom: 8px; }
        header p { font-size: 1.1rem; opacity: 0.9; }

        /* Barra de atalhos rápidos de rolagem */
        .menu-rolagem {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: -22px auto 30px auto;
            max-width: 450px;
            position: relative;
            z-index: 10;
        }
        .btn-rolar {
            flex: 1;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: white;
            font-size: 0.95rem;
        }
        .btn-rolar.v-btn { background-color: var(--verde); }
        .btn-rolar.a-btn { background-color: var(--azul); }

        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 0 20px 60px 20px; 
        }

        .secao-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 60px;
            background: var(--branco);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            border: 1px solid #e9ecef;
        }
        
        @media (min-width: 850px) {
            .secao-layout { grid-template-columns: 380px 1fr; align-items: start; }
        }

        .formulario h2 { font-size: 1.3rem; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dee2e6; border-radius: 8px; font-size: 0.95rem; outline: none; background: #fdfdfd; }
        
        .btn-enviar { color: var(--branco); padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-enviar.v-cor { background: var(--verde); }
        .btn-enviar.a-cor { background: var(--azul); }

        /* Lista de tópicos e produtos */
        .coluna-lista { display: flex; flex-direction: column; gap: 15px; }
        .coluna-lista h3 { font-size: 1.25rem; margin-bottom: 5px; }
        
        .card-topico { background: #fafafa; padding: 20px; border-radius: 12px; border: 1px solid #eee; border-left: 5px solid var(--verde); }
        .card-topico.tag-praga { border-left-color: var(--laranja); }
        .card-topico-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; color: #6c757d; }
        
        .badge { padding: 4px 10px; border-radius: 100px; font-weight: 600; font-size: 0.75rem; }
        .bg-praga { background: #fff3cd; color: #664d03; }
        .bg-plantio { background: #d1e7dd; color: #0f5132; }

        .vitrine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .card-produto { background: #fafafa; border-radius: 12px; border: 1px solid #eee; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; min-height: 220px; border-top: 4px solid var(--azul); }
        .preco { font-size: 1.35rem; color: var(--azul); font-weight: 700; margin: 12px 0; }
        .zap-link { background-color: #25d366; color: white; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; display: block; }
        
        .divisor { border: none; border-top: 2px dashed #cbd5e1; margin: 40px 0; }
    </style>
</head>
<body>

    <header>
        <h1>🌱 AgroForte</h1>
        <p>Agro forte, futuro sustentável: equilíbrio que transforma</p>
    </header>

    <!-- Botões de navegação rápida por rolagem de página -->
    <div class="menu-rolagem">
        <a href="#ajuda-comunidade" class="btn-rolar v-btn">💬 Ajuda da Comunidade</a>
        <a href="#vendas-trocas" class="btn-rolar a-btn">🛒 Vendas e Trocas</a>
    </div>

    <div class="container">

        <!-- SEÇÃO 1: AJUDA DA COMUNIDADE (FÓRUM) -->
        <section id="ajuda-comunidade" class="secao-layout" style="border-top: 4px solid var(--verde);">
            <div class="formulario">
                <h2 style="color: var(--verde-escuro);">💬 Nova Publicação</h2>
                <form id="forumForm">
                    <div class="form-group"><label>Seu Nome</label><input type="text" id="autor" placeholder="Ex: João Silva" required></div>
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="categoria" required>
                            <option value="plantio">🌱 Cultivo Sustentável</option>
                            <option value="praga">🐛 Problemas com Pragas</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Sua Pergunta</label><input type="text" id="titulo" placeholder="Ex: Como conter pulgões?" required></div>
                    <div class="form-group"><label>Explicação Completa</label><textarea id="conteudo" rows="4" placeholder="Descreva os detalhes..." required></textarea></div>
                    <button type="submit" class="btn-enviar v-cor">Publicar Pergunta</button>
                </form>
            </div>

            <div class="coluna-lista">
                <h3 style="color: var(--verde-escuro);">Perguntas da Comunidade</h3>
                <div id="forumFeed"></div>
            </div>
        </section>

        <hr class="divisor">

        <!-- SEÇÃO 2: VENDAS E TROCAS -->
        <section id="vendas-trocas" class="secao-layout" style="border-top: 4px solid var(--azul);">
            <div class="formulario">
                <h2 style="color: var(--azul);">🛒 Cadastrar Item</h2>
                <form id="vendasForm">
                    <div class="form-group"><label>Seu Nome</label><input type="text" id="vendedor" placeholder="Ex: Maria Souza" required></div>
                    <div class="form-group"><label>Produto ou Insumo</label><input type="text" id="produto" placeholder="Ex: Sobra de adubo orgânico" required></div>
                    <div class="form-group"><label>Preço ou Proposta de Troca</label><input type="text" id="preco" placeholder="Ex: 45,00 ou Troca" required></div>
                    <div class="form-group"><label>WhatsApp (com DDD, apenas números)</label><input type="tel" id="whatsapp" placeholder="Ex: 11999999999" required></div>
                    <div class="form-group"><label>Condições do Item</label><textarea id="descProduto" rows="3" placeholder="Detalhes sobre o produto..." required></textarea></div>
                    <button type="submit" class="btn-enviar a-cor">Anunciar Desapego</button>
                </form>
            </div>

            <div class="coluna-lista">
                <h3 style="color: var(--azul);">Itens para Venda e Troca</h3>
                <div class="vitrine-grid" id="vitrineFeed"></div>
            </div>
        </section>

    </div>

        ];

        let produtos = JSON.parse(localStorage.getItem('agro_produtos')) || [
            { vendedor: "Roberto Silva", produto: "Pulverizador Costal 20L", preco: "120,00", whatsapp: "11999999999", desc: "Equipamento revisado, bicos limpos, ideal para hortas." }
        ];

        function renderizarForum() {
            const feed = document.getElementById('forumFeed');
            feed.innerHTML = '';

                const isPraga = post.categoria === 'praga';
                feed.innerHTML += `
                    <div class="card-topico ${isPraga ? 'tag-praga' : ''}">
                        <div class="card-topico-header">
                            <span>Por: <strong>${post.autor}</strong></span>
                            <span class="badge ${isPraga ? 'bg-praga' : 'bg-plantio'}">${isPraga ? '🐛 Praga' : '🌱 Cultivo'}</span>
                        </div>
                        <h4 style="font-weight:700;">${post.titulo}</h4>
                        <p style="color:#4a4a4a; font-size:0.95rem; margin-top:6px; line-height:1.5;">${post.conteudo}</p>
                    </div>`;
            });
        }
